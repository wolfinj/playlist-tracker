<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Playlist Tracker v7</title><link rel="stylesheet" href="./styles.css"></head>
<body><header><strong>▶ Playlist Tracker <small>v7</small></strong><span id="account">Not signed in</span><button id="login">Sign in with Google</button><button id="logout" hidden>Sign out</button></header>
<p id="status" role="status"></p><main id="workspace" hidden><section><div id="player"></div><h2 id="title">Select a video</h2><p id="description"></p><a id="link" target="_blank" rel="noopener noreferrer"></a><div id="review" hidden><label><input id="watched" type="checkbox"> Watched</label><label>Rating <select id="rating"><option value="0">Unrated</option><option value="1">Skip</option><option value="2">Not for me</option><option value="3">OK</option><option value="4">Worth watching</option><option value="5">Recommend</option></select></label><label>Comment <textarea id="comment"></textarea></label><button id="saveReview">Save review</button></div></section><aside><div class="row"><select id="playlists" aria-label="Playlist"></select><button id="add" aria-label="Add playlist">+</button></div><p id="progress"></p><input type="search" id="search" placeholder="Search videos" autocomplete="off"><div id="videos"></div></aside></main>
<dialog id="importDialog"><form id="importForm"><h2>Import playlist</h2><input id="playlistUrl" required placeholder="YouTube playlist URL or ID"><button type="submit">Import</button><button type="button" id="cancelImport">Cancel</button></form></dialog>
<script type="module" src="./app.js"></script></body></html>
