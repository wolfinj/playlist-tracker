<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Video recommendations</title><style>
*{box-sizing:border-box}body{margin:0;background:#201e21;color:#eeeae6;font:15px system-ui,sans-serif;color-scheme:dark}header{border-bottom:1px solid #413e42;padding:15px max(20px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header a,a{color:#8ec7d6;text-decoration:none}a:hover{text-decoration:underline}main{max-width:1080px;margin:auto;padding:32px 20px 64px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;color:#a9dc76;font-weight:700}h1{font-size:clamp(25px,4vw,40px);line-height:1.2;margin:10px 0}p{line-height:1.6}#author{color:#b9b3b9;margin:8px 0}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.summary div{flex:1;min-width:110px;border:1px solid #454147;border-radius:10px;padding:14px;background:#29262a}.summary strong{display:block;font-size:25px}.summary span{font-size:12px;color:#b4adb5}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;padding:14px;border:1px solid #454147;border-radius:10px;background:#29262a}label{display:grid;gap:5px;font-size:12px;color:#b4adb5}input,select{min-width:0;width:100%;background:#232124;border:1px solid #58535a;border-radius:6px;padding:9px;color:#eee;font:inherit;font-size:14px}#message{color:#aaa;font-size:13px}#rows{display:grid;gap:12px}article{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;border:1px solid #454147;border-radius:12px;padding:15px;background:#2d2a2e;align-items:start}article img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:#201e21}article h2{font-size:17px;line-height:1.4;margin:8px 0}article p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:12px;color:#b4adb5}.rating{display:inline-flex;align-items:center;font-weight:650;font-size:12px;border-radius:5px;background:#39363b;padding:4px 8px;color:var(--accent,#aaa)}.comment{border-left:2px solid #68616a;padding-left:12px;color:#e0dbe0}.watch{font-size:13px;display:inline-block;margin-top:8px}footer{margin-top:30px;font-size:12px;color:#aaa}@media(max-width:650px){main{padding:22px 14px}.controls{grid-template-columns:1fr 1fr}.controls label:first-child{grid-column:1/-1}article{grid-template-columns:1fr;gap:10px}article img{max-width:360px}.summary div{min-width:80px;padding:10px}}
</style></head><body><header><strong>▶ Playlist Tracker</strong><a href="/">Open tracker ↗</a></header><main><div class="eyebrow">Curated video collection</div><h1 id="heading">Video recommendations</h1><p id="author" hidden></p><div id="summary" class="summary"></div><div class="controls"><label>Search videos<input id="query" type="search" placeholder="Title, channel or comment"></label><label>Rating<select id="rating"><option value="all">All ratings</option></select></label><label>Sort by<select id="order"><option value="rating">Highest rating</option><option value="low">Lowest rating</option><option value="title">Title A–Z</option><option value="original">Shared order</option></select></label></div><p id="message" role="status">Loading…</p><div id="rows"></div><footer>Personal recommendations shared with you. No account required to view.</footer></main><script type="module" src="./reviews.js"></script></body></html>
